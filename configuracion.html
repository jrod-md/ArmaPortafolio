<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuracion - Folium81</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-init.js"></script>
  </head>
  <body class="page-settings">
    <script src="auth-guard.js"></script>
    <header class="navbar navbar--auth">
      <div class="navbar__inner container">
        <a href="dashboard.html" class="wordmark">Folium81</a>
        <div class="navbar__auth">
          <span class="navbar__email" id="navEmail">demo@utp.ac.pa</span>
          <nav class="navbar__auth-links" aria-label="Cuenta">
            <a href="perfil.html">Perfil</a>
            <span class="navbar__sep" aria-hidden="true">·</span>
            <a href="configuracion.html" aria-current="page">Configuracion</a>
            <span class="navbar__sep" aria-hidden="true">·</span>
            <a href="login.html" class="nav-logout">Cerrar sesion</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="settings-main">
      <div class="settings-inner">
        <h1 class="settings-page-title">Configuracion</h1>

        <section class="settings-card card" aria-labelledby="settings-pref-heading">
          <h2 class="settings-card__overtitle" id="settings-pref-heading">Preferencias</h2>

          <div class="settings-row settings-row--last">
            <div class="settings-row__text">
              <h3 class="settings-row__label">Idioma de la interfaz</h3>
              <p class="settings-row__desc">Idioma de los textos del sistema.</p>
            </div>
            <div class="settings-row__control">
              <select class="wizard-input wizard-select settings-select" id="settings-lang" aria-label="Idioma">
                <option value="es" selected>Espanol</option>
                <option value="en" disabled>English (proximamente)</option>
                <option value="fr" disabled>Francais (bientot)</option>
              </select>
            </div>
          </div>
        </section>

        <section class="settings-card settings-card--danger card" aria-labelledby="settings-danger-heading">
          <h2 class="settings-card__overtitle settings-card__overtitle--danger" id="settings-danger-heading">
            Zona de riesgo
          </h2>
          <button type="button" class="btn settings-btn-danger" id="btn-revoke-all-sessions">
            Cerrar sesion en todos los dispositivos
          </button>
          <p class="settings-danger-desc">
            Invalida la sesion actual y cualquier otra activa.
          </p>
        </section>

        <p class="settings-legal">
          <a href="index.html">Folium81</a>
          <span class="settings-legal__sep" aria-hidden="true">·</span>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">Codigo abierto MIT</a>
          <span class="settings-legal__sep" aria-hidden="true">·</span>
          <a href="index.html#privacidad">Ley 81 de Panama</a>
          <span class="settings-legal__sep" aria-hidden="true">·</span>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">Reportar un problema</a>
        </p>
      </div>
    </main>

    <script>
      (function () {
        var revoke = document.getElementById("btn-revoke-all-sessions");
        if (revoke) {
          revoke.addEventListener("click", function () {
            try {
              sessionStorage.removeItem("folium_demo");
            } catch (e) {}
            window.location.href = "login.html";
          });
        }
      })();
    </script>
  </body>
</html>
