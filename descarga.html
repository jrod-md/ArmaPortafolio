<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descargar portafolio - ArmaPortafolio</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Página temporal para descargar el ZIP generado del portafolio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/folleto.css?v=4" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body class="page-descarga">
    <header class="band">
      <a href="index.html" class="wordmark">ArmaPortafolio</a>
      <nav class="band__nav" aria-label="Principal">
        <a href="nosotros.html">El proyecto</a>
        <a href="faq.html">FAQ</a>
        <a href="ayuda.html">Ayuda</a>
      </nav>
    </header>

    <div class="descarga-layout">
      <main class="descarga-main">
        <section class="wizard-panel wizard-panel--enter">
          <p class="wizard-kicker" id="descarga-kicker">Listo</p>
          <h1 class="wizard-panel__title descarga-title" id="descarga-title">Tu portafolio está armado.</h1>
          <p class="wizard-panel__subtitle descarga-lead" id="descarga-lead">Abre la portada y revísala antes de entregar.</p>
          <p class="descarga-filename">portafolio.zip</p>
          <p class="descarga-note" hidden></p>
          <button type="button" class="btn btn--primary descarga-btn">Descargar ZIP</button>
          <p class="descarga-links">
            <a href="generar.html" id="descarga-again">Armar otro portafolio</a>
            <a href="index.html">Ir al inicio</a>
          </p>
        </section>
      </main>

      <aside class="descarga-side" aria-labelledby="contenido-title">
        <div class="stack-stage" aria-hidden="true">
          <div class="stack is-zipped">
            <div class="fold is-filled"><i class="back"></i><i class="page"></i><i class="front"></i></div>
            <div class="fold is-filled"><i class="back"></i><i class="page"></i><i class="front"></i></div>
            <div class="fold is-filled"><i class="back"></i><i class="page"></i><i class="front"><span>Portada</span></i></div>
          </div>
        </div>
        <div class="contenido">
          <h2 class="contenido__title" id="contenido-title">Dentro del ZIP</h2>
          <ul class="contenido__list" id="contenido-lista">
            <li><span>01_Portada</span><span>1 archivo</span></li>
          </ul>
          <p class="contenido__total"><span>Peso total</span><span id="contenido-peso">-</span></p>
        </div>
      </aside>
    </div>

    <script src="js/zip.js?v=7"></script>
    <script src="js/download.js?v=11"></script>
  </body>
</html>
