<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descargar portafolio - Portafolio FISC</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Página temporal para descargar el ZIP generado del portafolio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"

    <link rel="stylesheet" href="css/styles.css?v=3" />

    <script src="theme-init.js"></script>

  <body class="page-descarga">
    <header class="navbar reveal">
      <div class="navbar__inner container">
        <a href="index.html" class="wordmark">Portafolio FISC</a>
        <nav class="navbar__nav" aria-label="Principal">
          <a href="nosotros.html">Nosotros</a>
          <span class="navbar__sep" aria-hidden="true">·</span>
          <a href="faq.html">FAQ</a>
          <span class="navbar__sep" aria-hidden="true">·</span>
          <a href="ayuda.html">Ayuda</a>
        </nav>
      </div>
    </header>

    <main class="descarga-main reveal">
      <div class="descarga-inner">
        <section class="success-hero">
          <div class="success-hero__badge" aria-hidden="true">
            <svg width="60" height="60" viewBox="0 0 86 86" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="43" cy="43" r="42" fill="#0F3D2E" fill-opacity="0.14" stroke="#0F3D2E" stroke-opacity="0.22" />
              <path d="M26 44l11 11 23-23" stroke="#0F3D2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <p class="success-hero__eyebrow">Completado</p>
          <h1 class="descarga-title">Tu portafolio esta listo</h1>
          <p class="descarga-lead">
            Todo quedo estructurado en el formato solicitado: portada, carpetas y documentos organizados.
          </p>
        </section>

        <section class="descarga-preview" aria-label="Vista previa">
          <p class="descarga-filename">portafolio_Lopez_BasesDeDatos_I2026.zip</p>
          <button type="button" class="btn btn--primary descarga-btn">Descargar ZIP</button>
        </section>

        <div class="descarga-actions">
          <a href="generar.html" class="btn btn--outline descarga-btn-secondary">Generar otro portafolio</a>
          <p class="descarga-panel-link"><a href="index.html">Ir al inicio</a></p>
        </div>

        <p class="descarga-note" hidden></p>
      </div>
    </main>

    <script src="js/zip.js?v=3"></script>
    <script src="js/download.js?v=2"></script>
