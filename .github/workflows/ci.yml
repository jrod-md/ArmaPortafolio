name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Revisar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Enlaces y archivos que no existen, código en línea que la CSP bloquea, ids rotos.
      # Corre en Linux, así que también detecta nombres con mayúsculas distintas.
      - name: Revisión estática
        run: npm run check

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Pruebas de punta a punta contra dist/, servida con las cabeceras de _headers.
      - name: Pruebas de punta a punta
        run: npx playwright test

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Publicar en Cloudflare Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://armaport.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Armar la carpeta pública
        run: node scripts/build-export.mjs

      # Sin los dos secretos no se publica nada: el trabajo termina bien y deja un aviso.
      - name: Comprobar credenciales
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sin publicar::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. No se publicó nada."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        if: steps.credentials.outputs.configured == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name armaport --branch main
