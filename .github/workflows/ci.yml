name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Revisar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Enlaces y archivos que no existen, código en línea que la CSP bloquea, ids rotos.
      # Corre en Linux, así que también detecta nombres con mayúsculas distintas.
      - name: Revisión estática
        run: npm run check

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Pruebas de punta a punta contra dist/, servida con las cabeceras de _headers.
      - name: Pruebas de punta a punta
        run: npx playwright test

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
